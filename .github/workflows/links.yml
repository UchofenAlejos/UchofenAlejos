name: Link check

on:
  pull_request:
  push:
    branches:
      - main
      - master
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --no-progress --config .lychee.toml "**/*.md" "**/*.html" "**/*.svg"
          fail: true
