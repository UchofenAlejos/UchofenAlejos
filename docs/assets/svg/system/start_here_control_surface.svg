<svg width="1100" height="320" viewBox="0 0 1100 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Profile control surface</title>
  <desc id="desc">Three routes through the profile: featured projects, technical domains, and learning focus.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#020617"/><stop offset="1" stop-color="#0b1024"/></linearGradient>
    <linearGradient id="edge"><stop stop-color="#22d3ee"/><stop offset=".52" stop-color="#a78bfa"/><stop offset="1" stop-color="#22c55e"/></linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#38bdf8" stroke-opacity=".08"/></pattern>
    <style>.k{font:800 12px 'Segoe UI',Arial,sans-serif;letter-spacing:3px;fill:#67e8f9}.h{font:900 36px 'Segoe UI',Arial,sans-serif;fill:#f8fafc}.s{font:600 15px 'Segoe UI',Arial,sans-serif;fill:#94a3b8}.m{font:800 10px 'Segoe UI',Arial,sans-serif;letter-spacing:2px;fill:#67e8f9}.t{font:900 21px 'Segoe UI',Arial,sans-serif;fill:#f8fafc}.b{font:600 12px 'Segoe UI',Arial,sans-serif;fill:#cbd5e1}</style>
  </defs>
  <rect width="1100" height="320" rx="28" fill="url(#bg)"/>
  <rect width="1100" height="320" rx="28" fill="url(#grid)"/>
  <rect x="14" y="14" width="1072" height="292" rx="24" fill="none" stroke="url(#edge)" stroke-width="2" stroke-opacity=".7"/>
  <text x="60" y="64" class="k">JUANPABLO UCHOFEN ALEJOS · PROFILE</text>
  <text x="60" y="112" class="h">START HERE</text>
  <text x="60" y="142" class="s">A route through software projects, technical interests, and what I’m learning.</text>
  <path d="M120 224H980" stroke="url(#edge)" stroke-width="3" stroke-dasharray="14 12" opacity=".6"/>
  <g transform="translate(62 184)"><rect width="296" height="86" rx="16" fill="#07111f" stroke="#22d3ee"/><text x="22" y="30" class="m">01 · BUILT WORK</text><text x="22" y="59" class="t">Projects</text><text x="147" y="59" class="b">web · mobile · games</text></g>
  <g transform="translate(402 184)"><rect width="296" height="86" rx="16" fill="#07111f" stroke="#a78bfa"/><text x="22" y="30" class="m">02 · INTERESTS</text><text x="22" y="59" class="t">Tech domains</text><text x="176" y="59" class="b">security · AI</text></g>
  <g transform="translate(742 184)"><rect width="296" height="86" rx="16" fill="#07111f" stroke="#22c55e"/><text x="22" y="30" class="m">03 · IN PROGRESS</text><text x="22" y="59" class="t">Learning</text><text x="139" y="59" class="b">practice · growth</text></g>
</svg>
